name: Assemble initial artifact

on:
  push:
    branches:
      - feat/initial-artifact-app
    paths:
      - artifact-parts/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/initial-artifact-app
      - name: Assemble the single HTML file
        run: cat artifact-parts/part-* > index.html
      - name: Validate artifact
        run: node scripts/validate.mjs
      - name: Commit generated artifact and remove bootstrap files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -r artifact-parts
          git rm .github/workflows/assemble-artifact.yml
          git commit -m "feat: implement the single-file schedule artifact"
          git push
